[package]
name = "agent-hooks"
version = "0.1.0"
edition = "2021"
description = "Unified local completion-hook adapters for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
json5 = "0.4"
toml_edit = "0.22"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
