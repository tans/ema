[package]
name = "ema-core"
version = "0.1.9"
edition = "2021"
description = "Email-native local agent runtime"

[dependencies]
anyhow = "1"
chrono = "0.4"
imap = "2.4"
lettre = "0.11"
mailparse = "0.18"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
json5 = "0.4"
sha2 = "0.10"
toml_edit = "0.22"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
