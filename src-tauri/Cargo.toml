[package]
name = "ema-desktop"
version = "0.1.5"
edition = "2021"
build = "build.rs"

[lib]
name = "ema_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
ema-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tauri-build = { version = "2" }
