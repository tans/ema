name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace

  macos-package:
    name: macOS DMG (ad-hoc signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Bundle macOS DMG without paid credentials
        run: npx tauri build --bundles dmg
      - name: Verify installed app has ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find target -type d -name 'EMA.app' -path '*/bundle/macos/*' -print -quit)"
          test -n "$APP_PATH" || { echo "::error::No EMA.app built"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | tee /tmp/ema-codesign.log
          grep -q 'Signature=adhoc' /tmp/ema-codesign.log
