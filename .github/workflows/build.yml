name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify release metadata and signature rejection
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
      - name: Check hook adapters compile for Windows
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check -p agent-hooks --target x86_64-pc-windows-gnu --locked

  macos-package:
    name: macOS DMG and verified signed updater
    # Pull requests (including forks) must not receive the signing credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Require updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }
      - name: Bundle DMG and signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Verify updater against the client public key
        shell: bash
        run: |
          set -euo pipefail
          brew install minisign
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          python3 scripts/release_updater.py collect --root target/aarch64-apple-darwin --folder ci-updater --version "$VERSION" --platform aarch64-apple-darwin
          python3 scripts/release_updater.py manifest --folder ci-updater --version "$VERSION" --scope patch --repository "$GITHUB_REPOSITORY"
          # This is a CI fixture only; it is never uploaded to a GitHub Release.
          mv ci-updater/latest.json ci-updater/test-manifest.json
          (cd ci-updater && shasum -a 256 EMA_* test-manifest.json > SHA256SUMS)
      - name: Verify macOS app signature inside DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find target -type f -name '*.dmg' -path '*/bundle/dmg/*' -print -quit)"
          test -n "$DMG_PATH" || { echo "::error::No built DMG found"; exit 1; }
          MOUNT="$RUNNER_TEMP/ema-dmg-verify"
          mkdir -p "$MOUNT"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$MOUNT" "$DMG_PATH"
          trap 'hdiutil detach -quiet "$MOUNT" || true' EXIT
          APP_PATH="$MOUNT/EMA.app"
          test -d "$APP_PATH" || { echo "::error::EMA.app absent from DMG"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | tee /tmp/ema-codesign.log
          grep -q 'Signature=adhoc' /tmp/ema-codesign.log
      - name: Upload verified CI signing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ema-macos-signed-updater-${{ github.sha }}
          path: ci-updater/*
          if-no-files-found: error
          retention-days: 7
