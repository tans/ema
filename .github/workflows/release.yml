name: Desktop Release

# Version-driven release: patch (X.Y.Z, Z>0) builds Apple Silicon only;
# minor/major (X.Y.0) builds the complete desktop platform matrix.
on:
  push:
    tags:
      - "v[0-9]*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-ema
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source and versions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.gate.outputs.should_release }}
      matrix: ${{ steps.version.outputs.matrix }}
      scope: ${{ steps.version.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A stale run can get HTTP 403 when GitHub refuses a release target whose
      # .github/workflows tree no longer matches the current default branch.
      # Re-run on the latest main commit instead of rewriting an old release tag.
      - name: Require updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY before releasing signed updates."; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY_PASSWORD for the encrypted updater key."; exit 1; }
      - name: Confirm release source is latest main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Release source is stale. Run this workflow on the latest main."
            exit 1
          }
      - name: Check manifest versions and release ref
        id: version
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path
          package = json.loads(Path("package.json").read_text())["version"]
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          with Path("src-tauri/Cargo.toml").open("rb") as f:
              desktop = tomllib.load(f)["package"]["version"]
          with Path("crates/core/Cargo.toml").open("rb") as f:
              core = tomllib.load(f)["package"]["version"]
          assert len({package, tauri["version"], desktop, core}) == 1, "Version manifests differ"
          assert tauri["bundle"]["macOS"]["signingIdentity"] == "-", "Free macOS ad-hoc signing missing"
          assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", package), "Expected numeric X.Y.Z version"
          patch = int(package.split(".")[2])
          scope = "patch" if patch > 0 else "full"
          matrix = [
              {"name": "macOS ARM64", "platform": "macos-15", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin --bundles dmg"}
          ]
          if scope == "full":
              matrix += [
                  {"name": "macOS Intel", "platform": "macos-15-intel", "target": "x86_64-apple-darwin", "args": "--target x86_64-apple-darwin --bundles dmg"},
                  {"name": "Linux x64", "platform": "ubuntu-22.04", "target": "", "args": "--bundles deb,appimage"},
                  {"name": "Windows x64", "platform": "windows-latest", "target": "", "args": "--bundles nsis,msi"},
              ]
          tag = "v" + package
          if os.environ["GH_REF_TYPE"] == "tag":
              assert os.environ["GH_REF_NAME"] == tag, "Tag and manifest version differ"
          else:
              assert os.environ["GH_REF_NAME"] == "main", "Manual/bootstrap releases must use main"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write(f"tag={tag}\n")
              f.write(f"scope={scope}\n")
              f.write("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")) + "\n")
          print("Valid release", tag, "scope", scope, "platforms:", ", ".join(item["name"] for item in matrix))
          PY
      - name: Skip if this version is already public
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          STATE="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$STATE" == "false" ]]; then
            echo "Version $RELEASE_TAG is already public; not rebuilding"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  initialize:
    name: Create draft pre-release
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create unpublished alpha release (and tag if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SCOPE: ${{ needs.validate.outputs.scope }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Never point a new release at a stale commit. The built-in GITHUB_TOKEN
          # may be forbidden from creating/updating tags on a commit whose workflow
          # files differ from the live default branch.
          CURRENT_MAIN="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$CURRENT_MAIN" ]]; then
            echo "::error::main advanced after validation ($CURRENT_MAIN). Start a fresh release run."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing tag $RELEASE_TAG points to another commit. Bump version instead of force-moving an existing tag."
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Reusing draft for $RELEASE_TAG (same source SHA)"
          else
            cat > /tmp/release-notes.md <<NOTES
          # EMA ${RELEASE_TAG} — Alpha preview

          Packaging scope: ${RELEASE_SCOPE}. Patch versions ship only a macOS Apple Silicon (M-series) DMG. Versions ending in .0 ship the full macOS/Windows/Linux matrix.

          **No New App. Just Email.** A local-first Rust/Tauri email gateway, with bilingual settings, QQ Mail authorization code and local Agent Hooks.

          **Experimental, not production-safe:** Email sender whitelist does not authenticate sender identity. Use a controlled test mailbox and non-sensitive project context; keep workspace-write disabled.

          - macOS: ad-hoc signed, **NOT** Apple Developer ID signed or notarized.
          - Windows: unsigned. Linux: unsigned.
          - Updates are signed with the EMA updater key.

          See [Chinese installation guide](https://github.com/tans/ema/blob/main/docs/INSTALL.zh-CN.md)
          and [release documentation](https://github.com/tans/ema/blob/main/docs/RELEASING.md).
          Verify downloads against SHA256SUMS.
          NOTES
            # No --target or PATCH target_commitish. After the exact HEAD guard
            # GitHub creates the tag on its default branch without a workflow-
            # file cross-commit permission check.
            gh release create "$RELEASE_TAG" --draft --prerelease \
              --title "EMA $RELEASE_TAG (Alpha)" --notes-file /tmp/release-notes.md
          fi
          STATE="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          [[ "$STATE" == "true" ]] || { echo "::error::Refusing to mutate a public release"; exit 1; }

  bundle:
    name: Build ${{ matrix.name }}
    needs: [validate, initialize]
    if: needs.validate.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify square Linux AppImage icon
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import struct
          config = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          pngs = [Path("src-tauri") / p for p in config["bundle"]["icon"] if p.endswith(".png")]
          def square(p):
              if not p.is_file():
                  return False
              raw = p.read_bytes()[:24]
              return raw.startswith(bytes.fromhex("89504e470d0a1a0a")) and struct.unpack(">II", raw[16:24])[0] == struct.unpack(">II", raw[16:24])[1]
          assert any(square(p) for p in pngs), "Linux AppImage needs a square PNG bundle icon"
          PY
      - name: Build signed installers and updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Verify macOS app ad-hoc signature inside DMG
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find target -type f -name '*.dmg' -path '*/bundle/dmg/*' -print -quit)"
          test -n "$DMG_PATH" || { echo "::error::No DMG generated"; exit 1; }
          MOUNT="$RUNNER_TEMP/ema-dmg-verify"
          mkdir -p "$MOUNT"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$MOUNT" "$DMG_PATH"
          trap 'hdiutil detach -quiet "$MOUNT" || true' EXIT
          APP_PATH="$MOUNT/EMA.app"
          test -d "$APP_PATH" || { echo "::error::No EMA.app in DMG"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | tee /tmp/ema-codesign.log
          grep -q 'Signature=adhoc' /tmp/ema-codesign.log

      - name: Collect and upload exact platform assets to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ROOT=target
          PLATFORM="$BUILD_TARGET"
          if [[ -n "$BUILD_TARGET" ]]; then
            ROOT="target/$BUILD_TARGET"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            PLATFORM=linux
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            PLATFORM=windows
          fi
          python3 scripts/release_updater.py collect --root "$ROOT" --folder release-assets --version "${RELEASE_TAG#v}" --platform "$PLATFORM"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

  checksums:
    name: Attach checksum manifest
    needs: [validate, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify all updater signatures and publish manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SCOPE: ${{ needs.validate.outputs.scope }}
        run: |
          set -euo pipefail
          mkdir -p bundles
          gh release download "$RELEASE_TAG" --dir bundles
          python3 scripts/release_updater.py manifest --folder bundles --version "${RELEASE_TAG#v}" --scope "$RELEASE_SCOPE" --repository "$GH_REPO"
          gh release upload "$RELEASE_TAG" bundles/latest.json bundles/SHA256SUMS --clobber

  publish:
    name: Publish Alpha as latest updater release
    needs: [validate, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only after selected platform builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          # A release must not publish an installer from an older main commit.
          CURRENT_MAIN="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          [[ "$CURRENT_MAIN" == "$GITHUB_SHA" ]] || {
            echo "::error::main moved during packaging. Refusing to publish stale binaries."
            exit 1
          }
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx latest.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets             --jq '{url, isDraft, isPrerelease, files: [.assets[].name]}'
