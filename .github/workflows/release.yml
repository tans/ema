name: Desktop Release

# Tag pushes are the standard release route. The workflow's first merge to main
# bootstraps the v0.1.1 alpha once, without requiring any paid credentials.
on:
  push:
    tags:
      - "v[0-9]*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-ema
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source and versions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Only main commits may be released"
            exit 1
          }
      - name: Check manifest versions and release ref
        id: version
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path
          package = json.loads(Path("package.json").read_text())["version"]
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          with Path("src-tauri/Cargo.toml").open("rb") as f:
              desktop = tomllib.load(f)["package"]["version"]
          with Path("crates/core/Cargo.toml").open("rb") as f:
              core = tomllib.load(f)["package"]["version"]
          assert len({package, tauri["version"], desktop, core}) == 1, "Version manifests differ"
          assert tauri["bundle"]["macOS"]["signingIdentity"] == "-", "Free macOS ad-hoc signing missing"
          tag = "v" + package
          if os.environ["GH_REF_TYPE"] == "tag":
              assert os.environ["GH_REF_NAME"] == tag, "Tag and manifest version differ"
          else:
              assert os.environ["GH_REF_NAME"] == "main", "Manual/bootstrap releases must use main"
              assert tag == "v0.1.3", "Branch-triggered release expects v0.1.3"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write(f"tag={tag}\n")
          print("Valid release", tag)
          PY
      - name: Skip if this version is already public
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          STATE="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$STATE" == "false" ]]; then
            echo "Version $RELEASE_TAG is already public; not rebuilding"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  initialize:
    name: Create draft pre-release
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create unpublished alpha release (and tag if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing draft release will receive build assets"
          else
            cat > /tmp/release-notes.md <<'NOTES'
          # EMA v0.1.3 — Alpha preview

          **No New App. Just Email.** A local-first Rust/Tauri email gateway with neon blue-and-green branding, compact bilingual settings, QQ Mail authorization-code preset, and Codex native sessions.

          **Experimental and not production-safe:** Real mailbox/Codex integration,
          sender-authentication safeguards, approval flows and platform installation
          have not yet been fully verified. Use only a controlled test mailbox and
          non-sensitive project context; keep workspace-write disabled.

          - macOS: ad-hoc signed, **NOT** Apple Developer ID signed or notarized.
            A one-time allow decision may be needed in System Settings > Privacy & Security.
          - Windows: no Authenticode publisher signature; SmartScreen may warn.
          - Linux: packages are unsigned.
          - Automatic updates are not enabled.

          See [Chinese installation guide](https://github.com/tans/ema/blob/main/docs/INSTALL.zh-CN.md)
          and [release documentation](https://github.com/tans/ema/blob/main/docs/RELEASING.md).
          Verify downloads against the included SHA256SUMS before use.
          NOTES
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA"               --draft --prerelease --title "EMA $RELEASE_TAG (Alpha)"               --notes-file /tmp/release-notes.md
          fi
          # Draft releases may be rebuilt after fixes. Bind their tag and target
          # to the exact source commit used for the new installer matrix.
          # This is safe only while the release is unpublished.
          STATE="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          test "$STATE" = "true" || { echo "::error::Refusing to mutate a public tag"; exit 1; }
          RELEASE_ID="$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')"
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -f target_commitish="$GITHUB_SHA" >/dev/null
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if test "$TAG_SHA" != "$GITHUB_SHA"; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
          fi

  bundle:
    name: Build ${{ matrix.name }}
    needs: [validate, initialize]
    if: needs.validate.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            platform: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
          - name: Linux x64
            platform: ubuntu-22.04
            target: ""
            args: "--bundles deb,appimage"
          - name: Windows x64
            platform: windows-latest
            target: ""
            args: "--bundles nsis,msi"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev
      - name: Install frontend dependencies
        run: npm install
      - name: Verify square Linux AppImage icon
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import struct
          config = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          pngs = [Path("src-tauri") / p for p in config["bundle"]["icon"] if p.endswith(".png")]
          def square(p):
              if not p.is_file():
                  return False
              raw = p.read_bytes()[:24]
              return raw.startswith(bytes.fromhex("89504e470d0a1a0a")) and struct.unpack(">II", raw[16:24])[0] == struct.unpack(">II", raw[16:24])[1]
          assert any(square(p) for p in pngs), "Linux AppImage needs a square PNG bundle icon"
          PY
      - name: Build and upload installers to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: "EMA ${{ needs.validate.outputs.tag }} (Alpha)"
          releaseBody: |
            # EMA v0.1.3 — Public Alpha preview
            Local-first email gateway for Codex (Rust + Tauri 2). This Alpha refreshes EMA's neon blue-and-green brand mark, native app icons, and compact desktop configuration UI.
            **Experimental, not production-safe**: only use a controlled test
            mailbox and non-sensitive, read-only local context.
            Sender authentication, action approvals, live QQ mail/Agent validation,
            and auto-updates are not yet complete.

            macOS: ad-hoc signed, NOT Apple notarized (first-run approval may be required).
            Windows: unsigned, SmartScreen may warn. Linux: unsigned.
            [中文安装说明](https://github.com/tans/ema/blob/main/docs/INSTALL.zh-CN.md)
            [发布与已知限制](https://github.com/tans/ema/blob/main/docs/RELEASING.md)
            Download SHA256SUMS to check asset integrity.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
      - name: Verify macOS app ad-hoc signature inside DMG
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find target -type f -name '*.dmg' -path '*/bundle/dmg/*' -print -quit)"
          test -n "$DMG_PATH" || { echo "::error::No DMG generated"; exit 1; }
          MOUNT="$RUNNER_TEMP/ema-dmg-verify"
          mkdir -p "$MOUNT"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$MOUNT" "$DMG_PATH"
          trap 'hdiutil detach -quiet "$MOUNT" || true' EXIT
          APP_PATH="$MOUNT/EMA.app"
          test -d "$APP_PATH" || { echo "::error::No EMA.app in DMG"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | tee /tmp/ema-codesign.log
          grep -q 'Signature=adhoc' /tmp/ema-codesign.log

  checksums:
    name: Attach checksum manifest
    needs: [validate, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify all installers and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p bundles
          gh release download "$RELEASE_TAG" --dir bundles
          (
            cd bundles
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            test -s SHA256SUMS
          )
          gh release upload "$RELEASE_TAG" bundles/SHA256SUMS --clobber

  publish:
    name: Publish public Alpha pre-release
    needs: [validate, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only after all platform builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets             --jq '{url, isDraft, isPrerelease, files: [.assets[].name]}'
